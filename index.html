<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pincode BO Locator</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #f4f7fb;
            color: #172033
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 32px 18px
        }

        .hero {
            text-align: center;
            margin-bottom: 28px
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 5vw, 44px)
        }

        .hero p {
            margin: 0;
            color: #687386
        }

        .search {
            max-width: 620px;
            margin: 24px auto;
            display: flex;
            gap: 10px
        }

        .search input {
            flex: 1;
            padding: 15px 17px;
            border: 1px solid #d6dce7;
            border-radius: 12px;
            font-size: 17px;
            outline: none;
            background: white
        }

        .search input:focus {
            border-color: #4f7cff;
            box-shadow: 0 0 0 3px #4f7cff22
        }

        .search button {
            padding: 0 24px;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer
        }

        .search button:hover {
            background: #1d4ed8
        }

        .message {
            text-align: center;
            color: #687386;
            margin: 15px 0
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px
        }

        .card {
            background: white;
            border: 1px solid #e3e8f0;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 6px 20px #1720330a;
            cursor: pointer;
            transition: .2s
        }

        .card:hover,
        .card.active {
            transform: translateY(-2px);
            border-color: #2563eb;
            box-shadow: 0 10px 28px #2563eb1c
        }

        .badge {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px
        }

        .card h3 {
            margin: 0 0 12px;
            font-size: 19px
        }

        .info {
            display: grid;
            gap: 7px;
            color: #5f6b7d;
            font-size: 14px
        }

        .info strong {
            color: #263247
        }

        .details {
            margin-top: 25px;
            background: white;
            border-radius: 18px;
            border: 1px solid #e3e8f0;
            overflow: hidden;
            display: none
        }

        .details.show {
            display: block
        }

        .details-content {
            padding: 22px
        }

        .details h2 {
            margin: 0 0 15px
        }

        .map {
            width: 100%;
            height: 420px;
            border: 0;
            display: block
        }

        .map-note {
            padding: 12px 18px;
            background: #f8fafc;
            color: #667085;
            font-size: 13px
        }

        @media(max-width:600px) {
            .container {
                padding: 22px 13px
            }

            .search {
                flex-direction: column
            }

            .search button {
                height: 50px
            }

            .map {
                height: 340px
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="hero">
            <h1>Pincode BO Locator</h1>
            <p>Enter a pincode to find all available Branch Offices (BO).</p>
        </div>

        <form class="search" id="searchForm">
            <input id="pincode" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit pincode"
                autocomplete="postal-code">
            <button type="submit">Search</button>
        </form>

        <div id="message" class="message">Enter a pincode to search.</div>
        <div id="results" class="grid"></div>

        <section id="details" class="details">
            <div class="details-content">
                <h2 id="selectedOffice"></h2>
                <div id="selectedInfo" class="info"></div>
            </div>
            <div id="mapWrap"></div>
        </section>
    </div>

    <script>
        /*
          Replace this array with your complete JSON data.
        
          Your JSON records must look like:
          {
            "circlename": "Telangana Circle",
            "regionname": "Hyderabad Region",
            "divisionname": "Adilabad Division",
            "officename": "Kothimir B.O",
            "pincode": "504273",
            "officetype": "BO",
            "delivery": "Delivery",
            "district": "KUMURAM BHEEM ASIFABAD",
            "statename": "TELANGANA",
            "latitude": "19.3638689",
            "longitude": "79.5376658"
          }
        
          IMPORTANT:
          This page displays only BO records.
        */
        const API_URL = "https://sarbeswarpanda04.github.io/Pin-code-api/all_india_pincodes_full.json";
        let DATA = [];

        const form = document.getElementById("searchForm");
        const input = document.getElementById("pincode");
        const results = document.getElementById("results");
        const message = document.getElementById("message");
        const details = document.getElementById("details");
        const selectedOffice = document.getElementById("selectedOffice");
        const selectedInfo = document.getElementById("selectedInfo");
        const mapWrap = document.getElementById("mapWrap");

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
            }[c]));
        }

        async function searchPincode(pin) {
            results.innerHTML = "";
            details.classList.remove("show");
            mapWrap.innerHTML = "";

            const shard = INDEX[pin];

            if (!shard) {
                message.textContent = `No pincode found for ${pin}.`;
                return;
            }

            message.textContent = "Loading matching offices...";

            try {
                const response = await fetch(`${API_BASE}/${shard}`, {
                    headers: { "Accept": "application/json" },
                    cache: "default"
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const shardData = await response.json();

                const offices = shardData.filter(item =>
                    String(item.pincode).trim() === pin &&
                    String(item.officetype).trim().toUpperCase() === "BO"
                );

                if (!offices.length) {
                    message.textContent = `No BO found for pincode ${pin}.`;
                    return;
                }

                message.textContent =
                    `${offices.length} Branch Office${offices.length > 1 ? "s" : ""} found for ${pin}.`;

                offices.forEach((office, index) => {
                    const card = document.createElement("article");
                    card.className = "card";
                    card.innerHTML = `
        <span class="badge">BRANCH OFFICE · BO</span>
        <h3>${escapeHTML(office.officename)}</h3>
        <div class="info">
          <div><strong>Pincode:</strong> ${escapeHTML(office.pincode)}</div>
          <div><strong>District:</strong> ${escapeHTML(office.district)}</div>
          <div><strong>State:</strong> ${escapeHTML(office.statename)}</div>
          <div><strong>Delivery:</strong> ${escapeHTML(office.delivery)}</div>
        </div>
      `;
                    card.addEventListener("click", () => showOffice(office, card));
                    results.appendChild(card);

                    if (index === 0) showOffice(office, card);
                });
            } catch (error) {
                console.error("Failed to load pincode shard:", error);
                message.textContent = "Unable to load this pincode data. Please try again.";
            }
        }

        function showOffice(office, card) {
            document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
            card.classList.add("active");

            selectedOffice.textContent = office.officename;

            selectedInfo.innerHTML = `
    <div><strong>Pincode:</strong> ${escapeHTML(office.pincode)}</div>
    <div><strong>District:</strong> ${escapeHTML(office.district)}</div>
    <div><strong>State:</strong> ${escapeHTML(office.statename)}</div>
    <div><strong>Circle:</strong> ${escapeHTML(office.circlename)}</div>
    <div><strong>Region:</strong> ${escapeHTML(office.regionname)}</div>
    <div><strong>Division:</strong> ${escapeHTML(office.divisionname)}</div>
    <div><strong>Delivery:</strong> ${escapeHTML(office.delivery)}</div>
    <div><strong>Coordinates:</strong> ${escapeHTML(office.latitude)}, ${escapeHTML(office.longitude)}</div>
  `;

            const lat = Number(office.latitude);
            const lon = Number(office.longitude);

            if (Number.isFinite(lat) && Number.isFinite(lon)) {
                const delta = 0.01;
                const bbox = `${lon - delta},${lat - delta},${lon + delta},${lat + delta}`;

                // OpenStreetMap embed: no API key required.
                const mapURL =
                    `https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(bbox)}` +
                    `&layer=mapnik&marker=${encodeURIComponent(lat)}%2C${encodeURIComponent(lon)}`;

                mapWrap.innerHTML = `
      <iframe
        class="map"
        src="${mapURL}"
        title="Map showing ${escapeHTML(office.officename)}"
        loading="lazy">
      </iframe>
      <div class="map-note">
        Location: ${escapeHTML(lat)}, ${escapeHTML(lon)}
      </div>
    `;
            } else {
                mapWrap.innerHTML = `<div class="map-note">Latitude/longitude is not available for this office.</div>`;
            }

            details.classList.add("show");
            details.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        async function loadData() {
            message.textContent = "Loading pincode index...";

            try {
                const response = await fetch(`${API_BASE}/index.json`, {
                    headers: { "Accept": "application/json" },
                    cache: "default"
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                INDEX = await response.json();

                message.textContent =
                    `Ready. ${Object.keys(INDEX).length.toLocaleString()} pincodes available. Enter a pincode.`;
            } catch (error) {
                console.error("Failed to load pincode index:", error);
                message.textContent =
                    "Unable to load the pincode index. Please check the GitHub Pages URL.";
            }
        }

        form.addEventListener("submit", e => {
            e.preventDefault();
            const pin = input.value.trim();

            if (!/^\d{6}$/.test(pin)) {
                results.innerHTML = "";
                details.classList.remove("show");
                message.textContent = "Please enter a valid 6-digit pincode.";
                input.focus();
                return;
            }

            searchPincode(pin);
        });

        input.addEventListener("input", () => {
            input.value = input.value.replace(/\D/g, "").slice(0, 6);
        });
    </script>
</body>

</html>

<script>
</script>
<script>loadData();</script>
